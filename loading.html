<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading 分层设计</title><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="loading.css"><main><a href="index.html">返回设计工作台</a><h1>Loading · 分层预览</h1><p>按原生前景坐标整理，模拟进度；不执行资源加载和 SDK。</p><label>加载进度 <input id="progress" type="range" min="0" max="100" value="58"></label><div class="loading-viewport"><div class="loading-scene"><img class="road" src="native-art/loading-road.png" alt="矿道"><img class="cat" src="native-art/loading-cat.png" alt="矿工"><img class="cart" src="native-art/loading-cart-treasure.png" alt="黄金宝石矿车"><img class="logo" src="native-art/debt-story-logo-v2.png" alt="挖矿还债记"><div class="progress-card"><span id="status">正在装载矿洞素材…</span><div class="track"><img src="native-art/progress-track.png" alt=""><img id="fill" src="native-art/progress-fill.png" alt=""></div><span id="percent">58%</span></div></div></div></main><script>const slider=document.getElementById('progress');function update(){document.getElementById('fill').style.clipPath=`inset(0 ${100-slider.value}% 0 0)`;document.getElementById('percent').textContent=slider.value+'%';document.getElementById('status').textContent=slider.value<25?'正在读取游戏配置…':slider.value<75?'正在装载矿洞素材…':slider.value<100?'正在准备进入矿洞…':'加载完成 · 预览不会自动跳转';}slider.addEventListener('input',update);update();</script></html>
